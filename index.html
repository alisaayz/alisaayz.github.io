<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Default to system appearance and apply a saved override before the first paint.
      {
        let preference = 'system'
        try {
          const saved = localStorage.getItem('portfolio-appearance')
          if (['system', 'light', 'dark'].includes(saved)) preference = saved
        } catch { /* Use system appearance when storage is unavailable. */ }
        const theme = preference === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : preference
        document.documentElement.dataset.themePreference = preference
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#ffffff' : '#111a27'
      }
    </script>
    <meta name="description" content="Alisa Zhu — MSBA student at UCLA Anderson School of Management. Explore my background, projects, and journey in business analytics." />
    <title>Alisa Zhu · Business Analytics</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
